name: CI

# The submission's gates, the same shape as lua-lunet/realworld-lua's CI:
# a test job (seeded db, no Postgres — SQLite only), and on v* tags a docker
# image for linux amd64 + arm64 pushed to GHCR. No hurl: this challenge's
# judge is test/test.sh's byte-exact suite, which the test job runs.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: test (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sqlite3 libluajit-5.1-2 libuv1 zlib1g libsqlite3-0 libsodium23
          sodium_lib="$(ldconfig -p | grep -m1 libsodium.so | awk '{print $NF}')"
          sudo ln -sf "$sodium_lib" "$(dirname "$sodium_lib")/libsodium.so"

      - name: Build the seed database
        run: bash seed/make-seed.sh

      - name: Test the submission (42 exact-byte checks)
        run: bash test/run.sh submissions/luna-lunet

  docker:
    name: docker (linux amd64 + arm64 → GHCR)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
